name: CI

# Validação em PR e push; release somente por tag v<versão> (debian/changelog),
# sem nunca substituir uma release existente. O pipeline compartilhado da
# organização compila em Ubuntu 26.04 fixado por digest, roda lintian e testa
# instalação, reinstalação, remoção e expurgo num contêiner limpo.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verificacoes:
    name: Entradas desktop e pacote 0.2.1 arquivado
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Preparar ferramentas
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends python3 gettext desktop-file-utils ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar entradas desktop traduzidas
        run: |
          set -euo pipefail
          mkdir -p build/desktop
          for template in data/*.desktop.in; do
            msgfmt --desktop --template="$template" -d po -o "build/desktop/$(basename "${template%.in}")"
          done
          desktop-file-validate build/desktop/*.desktop

      - name: Conferir o artefato 0.2.1 arquivado no repositório
        run: |
          set -euo pipefail
          cd releases/v0.2.1
          sha256sum -c mainuan-atualizador-recursos_0.2.1_all.deb.sha256
          printf '%s  %s\n' 'ba6d66c08d53d40d94bfc31da6110bb99fede20426796e68cf07607f0a16b0a2' 'mainuan-atualizador-recursos_0.2.1_all.deb' | sha256sum -c -
          python3 ../../tools/audit_python_package.py mainuan-atualizador-recursos_0.2.1_all.deb --expected-version 0.2.1

  pacote:
    needs: verificacoes
    permissions:
      contents: write # usado somente pelo job de release, e só em tags v*
    uses: mainuan/.github/.github/workflows/debian-package.yml@2409a50535befe90ac3bbfc4db6eed7d65eac4e5
    with:
      package: mainuan-atualizador-recursos
      release-title: Atualizador de Recursos
      # Os testes unitários rodam também em dh_auto_test, durante o build.
      test-command: |
        po/i18n.sh check-pot
        po/i18n.sh validate
        python3 -m compileall -q src bin tools
      smoke-command: |
        version="$(mainuan-atualizador-recursos --version)"
        echo "$version"
        test "$version" = "$(dpkg-query -W -f='${Version}' mainuan-atualizador-recursos)"
        mainuan-atualizador-recursos --help
        # Todos os módulos importam com as dependências declaradas.
        python3 -c "import sys; sys.path.insert(0, '/usr/lib/mainuan-atualizador-recursos'); import mainuan_recursos.application, mainuan_recursos.github_channel, mainuan_recursos.packagekit"
        test -f /usr/share/locale/pt_BR/LC_MESSAGES/mainuan-atualizador-recursos.mo
        test -f /etc/xdg/autostart/mainuan-recursos.desktop

  auditoria:
    name: Auditoria do pacote Python
    needs: pacote
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-mainuan-atualizador-recursos-${{ github.sha }}
          path: dist

      - name: Auditar o pacote compilado (Architecture all, sem binários nativos)
        env:
          VERSION: ${{ needs.pacote.outputs.version }}
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3
          cd dist
          sha256sum --check SHA256SUMS
          python3 ../tools/audit_python_package.py "mainuan-atualizador-recursos_${VERSION}_all.deb" --expected-version "$VERSION"
