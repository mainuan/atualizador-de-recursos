name: Testar e gerar pacote Debian
on:
  push:
    branches: [main]
    tags: [v0.2.0-rc1, v0.2.1, v0.2.2, v0.2.3]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar ferramentas
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pyqt6 python3-apt python3-cryptography debhelper dpkg-dev gnupg desktop-file-utils lintian
      - name: Testar
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validar entradas desktop
        run: desktop-file-validate data/*.desktop
      - name: Conferir o artefato final aprovado
        run: |
          cd releases/v0.2.1
          sha256sum -c mainuan-atualizador-recursos_0.2.1_all.deb.sha256
          printf '%s  %s\n' 'ba6d66c08d53d40d94bfc31da6110bb99fede20426796e68cf07607f0a16b0a2' 'mainuan-atualizador-recursos_0.2.1_all.deb' | sha256sum -c -
          /usr/bin/python3 ../../tools/audit_python_package.py mainuan-atualizador-recursos_0.2.1_all.deb --expected-version 0.2.1
      - name: Construir com debhelper
        run: dpkg-buildpackage -us -uc -b
      - name: Reunir pacote
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          package="mainuan-atualizador-recursos_${version}_all.deb"
          mkdir -p dist
          cp "../$package" "dist/$package"
          /usr/bin/python3 tools/audit_python_package.py "dist/$package" --expected-version "$version" --output dist/auditoria-pacote.json
          (cd dist && sha256sum "$package" > SHA256SUMS)
          dpkg-deb --info "dist/$package"
          dpkg-deb --contents "dist/$package"
          lintian "dist/$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainuan-atualizador-recursos-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
            dist/auditoria-pacote.json
          if-no-files-found: error
  prerelease:
    needs: build
    if: github.repository == 'mainuan/atualizadorderecursos' && github.ref == 'refs/tags/v0.2.0-rc1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conferir referência aprovada
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mainuan-atualizador-recursos-deb
          path: dist
      - name: Conferir pacote e checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(dpkg-deb -f mainuan-atualizador-recursos_0.2.0_all.deb Version)" = '0.2.0'
      - name: Publicar somente a versão candidata autorizada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mainuan-atualizador-recursos_0.2.0_all.deb dist/SHA256SUMS \
            --verify-tag --prerelease --latest=false --title 'Atualizador de Recursos 0.2.0 RC1' \
            --notes-file docs/v0.2.0-rc1.md
  release:
    needs: build
    if: github.repository == 'mainuan/atualizadorderecursos' && github.ref == 'refs/tags/v0.2.1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conferir referência e arquivos aprovados
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          cd releases/v0.2.1
          sha256sum -c mainuan-atualizador-recursos_0.2.1_all.deb.sha256
          printf '%s  %s\n' 'ba6d66c08d53d40d94bfc31da6110bb99fede20426796e68cf07607f0a16b0a2' 'mainuan-atualizador-recursos_0.2.1_all.deb' | sha256sum -c -
          test "$(dpkg-deb -f mainuan-atualizador-recursos_0.2.1_all.deb Version)" = '0.2.1'
          test "$(dpkg-deb -f mainuan-atualizador-recursos_0.2.1_all.deb Architecture)" = 'all'
      - name: Publicar a versão estável autorizada com o pacote homologado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/v0.2.1/mainuan-atualizador-recursos_0.2.1_all.deb \
            releases/v0.2.1/mainuan-atualizador-recursos_0.2.1_all.deb.sha256 \
            --verify-tag --latest --title 'Atualizador de Recursos 0.2.1' \
            --notes-file docs/v0.2.1.md
  release-023:
    needs: build
    if: github.repository == 'mainuan/atualizador-de-recursos' && github.ref == 'refs/tags/v0.2.3'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conferir referência autorizada
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mainuan-atualizador-recursos-deb
          path: dist
      - name: Conferir pacote e checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(dpkg-deb -f mainuan-atualizador-recursos_0.2.3_all.deb Version)" = '0.2.3'
          test "$(dpkg-deb -f mainuan-atualizador-recursos_0.2.3_all.deb Architecture)" = 'all'
      - name: Publicar versão estável 0.2.3 autorizada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mainuan-atualizador-recursos_0.2.3_all.deb dist/SHA256SUMS \
            --verify-tag --latest --title 'Atualizador de Recursos 0.2.3' \
            --notes-file docs/v0.2.3.md
