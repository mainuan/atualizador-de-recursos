name: Compilar e publicar DEB
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar Python
        run: python3 -m compileall -q src/ tests/
      - name: Executar testes
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Gerar pacote Debian
        run: bash build-package.sh
      - name: Validar pacote
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: mainuan-atualizador-recursos-deb
          path: dist/*.deb
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mainuan-atualizador-recursos-deb
          path: dist
      - name: Publicar pacote na Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
